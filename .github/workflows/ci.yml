name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'packages/gateway-sdk/src/view-dto.ts'
              - 'packages/gateway-sdk/src/events.ts'
              - 'packages/gateway-sdk/src/types.ts'
              - '.github/workflows/ci.yml'

  verify:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
            adapters/claude/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install gateway deps
        working-directory: gateway
        run: npm ci

      - name: Install claude adapter deps
        working-directory: adapters/claude
        run: npm ci

      - name: Build (plugin + gateway + tui)
        run: npm run build

      - name: Test plugin contract
        run: npm run test:plugin-contract

      - name: Test plugin example
        run: npm run test:plugin-example

      - name: Test plugin creator tools
        run: npm run test:creator

      - name: Verify bundled plugin contract resolution
        run: npm run verify:plugin-contract

      - name: Test gateway
        run: npm test --prefix gateway -- --forceExit

      - name: Test claude adapter
        working-directory: adapters/claude
        run: npm test

      - name: Test TUI
        run: npm run test:tui

      - name: Test runtime-kit
        run: npm run test:kit

      - name: Test gateway-sdk
        run: npm test -w @mafw/sdk

      - name: Test session-ui
        run: npm test -w @mafw/session-ui

      - name: Test ui
        run: npm test -w @mafw/ui

      - name: Test desktop
        run: npm run test:desktop

  flutter:
    name: mobile (flutter analyze + test)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Pinned: the flat/canonical goldens use null-aware collection elements (Dart 3.13).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter test (flat view DTO + canonical event goldens)
        working-directory: mobile
        run: flutter test
