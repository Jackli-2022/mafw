name: npm publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish mafw
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "npm publish skipped: NPM_TOKEN not configured"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          # npm stage 命令需要 npm CLI >= 11.15（node 24 自带）；node 22 的 npm 10 没有
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - name: Install root deps
        if: env.SKIP != 'true'
        run: npm ci

      - name: Install gateway deps
        if: env.SKIP != 'true'
        working-directory: gateway
        run: npm ci

      - name: Build
        if: env.SKIP != 'true'
        run: npm run build

      # Stage-only 发布流（token 为 stage-only granular token）：
      # CI 把版本送进 staging 区，维护者（2FA）在 npmjs.com「Staged Packages」
      # tab 或 CLI `npm stage approve` 审批后才真正上线。
      # 注意：stage 不能用于全新包首发 —— mafw 的首个版本需本地直接
      # `npm publish --registry=https://registry.npmjs.org`（输 OTP）。
      - name: Stage publish
        if: env.SKIP != 'true'
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
