name: npm publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish mafw
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "npm publish skipped: NPM_TOKEN not configured"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - name: Install root deps
        if: env.SKIP != 'true'
        run: npm ci

      - name: Install gateway deps
        if: env.SKIP != 'true'
        working-directory: gateway
        run: npm ci

      - name: Build
        if: env.SKIP != 'true'
        run: npm run build

      # NPM_TOKEN 必须是 Granular Access Token 且创建时开启：
      #   Packages permissions = Read and write（publish and stage，非 stage only）
      #   Bypass 2FA = true（2FA 强制账号的 CI 发布唯一免 OTP 路径）
      # 触发方式：Actions 页手动 Run workflow（人工控制发布时机）。
      - name: Publish
        if: env.SKIP != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
